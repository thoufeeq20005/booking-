# BookEasy backend configuration.
# Every secret comes from environment variables. For local development the root ../.env file
# is imported automatically (KEY=VALUE format); in production set real environment variables.
spring:
  application:
    name: bookeasy
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookeasy}?createDatabaseIfNotExist=${DB_CREATE_IF_MISSING:true}&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${DB_SSL_MODE:PREFERRED}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    # Schema is owned by Flyway; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}

server:
  port: ${PORT:8080}
  # Client IPs are resolved by ClientIpResolver from trusted proxy hops only (see CLIENT_IP_XFF_INDEX).
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Swagger UI / OpenAPI JSON are on in dev and off in prod unless API_DOCS_ENABLED=true.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

bookeasy:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  cors:
    # Comma-separated list of allowed browser origins.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    root-path: ${FILE_STORAGE_PATH:./data/uploads}
  security:
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
    client-ip-xff-index-from-right: ${CLIENT_IP_XFF_INDEX:0}
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: bookeasy
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}m
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_DAYS:14}d
    two-factor-challenge-ttl: 5m
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    refresh-cookie:
      name: be_rt
      path: /api/v1/auth
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: Strict
    otp:
      length: 6
      ttl: 5m
      max-attempts: 5
      resend-cooldown: 60s
      max-sends-per-hour: 5
    lockout:
      max-failures: 5
      duration: 15m
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    bootstrap:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      token: ${BOOTSTRAP_ADMIN_TOKEN:}
  payments:
    # Minutes an unpaid booking holds its slot before it expires.
    hold-minutes: ${PAYMENT_HOLD_MINUTES:15}
    # Dev only: without Razorpay keys, show the payment page with a simulated gateway (no money moves).
    # Ignored once Razorpay keys are set; always false in prod.
    demo-mode: ${PAYMENTS_DEMO_MODE:true}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      route-enabled: ${RAZORPAY_ROUTE_ENABLED:false}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
  notifications:
    # Dev only: with no provider configured, log emails/OTPs instead of failing. Always false in prod.
    dev-log-delivery: ${NOTIFICATIONS_DEV_LOG:true}
    email:
      provider: ${EMAIL_PROVIDER:}
      smtp-host: ${SMTP_HOST:}
      smtp-port: ${SMTP_PORT:587}
      smtp-username: ${SMTP_USERNAME:}
      smtp-password: ${SMTP_PASSWORD:}
      smtp-starttls: ${SMTP_STARTTLS:true}
      from-address: ${EMAIL_FROM_ADDRESS:}
      from-name: ${EMAIL_FROM_NAME:BookEasy}
    sms:
      provider: ${SMS_PROVIDER:}
      api-key: ${SMS_API_KEY:}
      base-url: ${SMS_BASE_URL:https://control.msg91.com}
      otp-template-id: ${SMS_OTP_TEMPLATE_ID:}
      otp-variable: ${SMS_OTP_VARIABLE:otp}

logging:
  # Regional-language text must survive in logs regardless of the host's default code page.
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.bookeasy: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: prod
  lifecycle:
    timeout-per-shutdown-phase: 25s
server:
  shutdown: graceful
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${DB_SSL_MODE:REQUIRED}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
bookeasy:
  auth:
    refresh-cookie:
      secure: true
  notifications:
    dev-log-delivery: false
  payments:
    demo-mode: false
