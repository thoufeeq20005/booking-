# BookEasy transactional email texts (UTF-8). MessageFormat: double any apostrophe ('').
email.verify.subject=अपना BookEasy ईमेल सत्यापित करें
email.verify.body=नमस्ते {0},\n\nअपना BookEasy खाता सेट अप पूरा करने के लिए अपने ईमेल पते की पुष्टि करें:\n{1}\n\nयह लिंक {2} घंटे में समाप्त हो जाएगा। यदि आपने खाता नहीं बनाया है, तो इस ईमेल को अनदेखा करें।\n\n– BookEasy
email.reset.subject=अपना BookEasy पासवर्ड रीसेट करें
email.reset.body=नमस्ते {0},\n\nहमें आपका BookEasy पासवर्ड रीसेट करने का अनुरोध मिला है। नया पासवर्ड यहाँ चुनें:\n{1}\n\nयह लिंक {2} मिनट में समाप्त हो जाएगा। यदि आपने यह अनुरोध नहीं किया है, तो इस ईमेल को अनदेखा करें – आपका पासवर्ड नहीं बदलेगा।\n\n– BookEasy

# Business verification (Phase 3). Bodies: {0}=owner name, {1}=business name, {2}=reason, {3}=link. Subjects: {0}=business name.
email.org.noReason=कोई कारण नहीं बताया गया।
email.org.submitted.subject={0} के लिए आपका आवेदन मिल गया
email.org.submitted.body=नमस्ते {0},\n\nBookEasy पर {1} पंजीकृत करने के लिए धन्यवाद। हमारी टीम आम तौर पर 2 कार्य दिवसों में आपके विवरण और दस्तावेज़ों की जाँच करेगी। निर्णय होते ही हम आपको ईमेल करेंगे।\n\nस्थिति यहाँ देखें:\n{3}\n\n– BookEasy
email.org.approved.subject={0} BookEasy पर स्वीकृत हो गया
email.org.approved.body=नमस्ते {0},\n\nखुशखबरी – {1} BookEasy पर सत्यापित और स्वीकृत हो गया है। अब आप अपनी सेवाएँ सेट करके बुकिंग लेना शुरू कर सकते हैं।\n\nअपना व्यवसाय खोलें:\n{3}\n\n– BookEasy
email.org.rejected.subject=कार्रवाई आवश्यक: {0} के लिए आपका आवेदन
email.org.rejected.body=नमस्ते {0},\n\nहम अभी {1} को स्वीकृत नहीं कर सके। हमारी समीक्षा टीम का कारण:\n{2}\n\nकृपया अपने विवरण या दस्तावेज़ अपडेट करके फिर से जमा करें:\n{3}\n\n– BookEasy
email.org.suspended.subject={0} BookEasy पर निलंबित कर दिया गया
email.org.suspended.body=नमस्ते {0},\n\n{1} को निलंबित कर दिया गया है और अब यह ग्राहकों को दिखाई नहीं देगा। कारण:\n{2}\n\nअगर आपको लगता है कि यह गलती है, तो BookEasy सहायता से संपर्क करें।\n{3}\n\n– BookEasy
email.org.reinstated.subject={0} BookEasy पर फिर से सक्रिय है
email.org.reinstated.body=नमस्ते {0},\n\n{1} को बहाल कर दिया गया है और यह फिर से ग्राहकों को दिखाई दे रहा है।\n\n{3}\n\n– BookEasy

# Admin reset of two-step verification (Phase 4). {0}=name, {1}=account link.
email.twoFactorReset.subject=आपके BookEasy खाते में दो-चरणीय सत्यापन बंद किया गया
email.twoFactorReset.body=नमस्ते {0},\n\nआपके अनुरोध पर BookEasy सहायता टीम ने आपके खाते में दो-चरणीय सत्यापन बंद कर दिया है और आपको सभी डिवाइस से साइन आउट कर दिया है।\n\nफिर से साइन इन करें और अपने नए फ़ोन के साथ इसे यहाँ सेट करें:\n{1}\n\nअगर आपने यह अनुरोध नहीं किया, तो तुरंत BookEasy सहायता से संपर्क करें।\n\n– BookEasy

# Staff invitation (Phase 5). Subject {0}=business. Body {0}=invitee, {1}=business, {2}=link, {3}=days.
email.staffInvite.subject={0} ने आपको BookEasy पर अपनी टीम में आमंत्रित किया है
email.staffInvite.body=नमस्ते {0},\n\n{1} ने आपको BookEasy पर अपनी टीम में शामिल होने के लिए आमंत्रित किया है, ताकि ग्राहक आपके साथ अपॉइंटमेंट बुक कर सकें।\n\nआमंत्रण यहाँ स्वीकार करें (इसी ईमेल पते से साइन इन करें या खाता बनाएँ):\n{2}\n\nयह लिंक {3} दिनों में समाप्त हो जाएगा। अगर आपको इसकी उम्मीद नहीं थी, तो इस ईमेल को अनदेखा करें।\n\n– BookEasy

