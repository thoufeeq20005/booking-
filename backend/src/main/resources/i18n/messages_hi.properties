email.loginCode.subject={0} आपका BookEasy साइन-इन कोड है
email.loginCode.body=नमस्ते {0},\n\nआपका BookEasy साइन-इन कोड है: {1}\n\nयह {2} मिनट में समाप्त हो जाएगा। यह कोड किसी के साथ साझा न करें – BookEasy स्टाफ़ कभी इसे नहीं माँगेगा।\nअगर आपने साइन इन करने की कोशिश नहीं की, तो इस ईमेल को अनदेखा करें।\n\n– BookEasy
