email.loginCode.body=നമസ്കാരം {0},\n\nനിങ്ങളുടെ BookEasy സൈൻ-ഇൻ കോഡ്: {1}\n\nഇത് {2} മിനിറ്റിനുള്ളിൽ കാലഹരണപ്പെടും. ഈ കോഡ് ആരുമായും പങ്കിടരുത് – BookEasy ജീവനക്കാർ ഒരിക്കലും ഇത് ചോദിക്കില്ല.\nനിങ്ങൾ സൈൻ ഇൻ ചെയ്യാൻ ശ്രമിച്ചില്ലെങ്കിൽ, ഈ ഇമെയിൽ അവഗണിക്കാം.\n\n– BookEasy
email.verifyCode.subject={0} ആണ് നിങ്ങളുടെ BookEasy ഇമെയിൽ സ്ഥിരീകരണ കോഡ്
email.verifyCode.body=നമസ്കാരം {0},\n\nBookEasy-യിൽ നിങ്ങളുടെ ഇമെയിൽ വിലാസം സ്ഥിരീകരിക്കാൻ ഈ കോഡ് ഉപയോഗിക്കുക: {1}\n\nഇത് {2} മിനിറ്റിനുള്ളിൽ കാലഹരണപ്പെടും. ഈ കോഡ് ആരുമായും പങ്കിടരുത്.\nനിങ്ങൾ BookEasy അക്കൗണ്ട് സൃഷ്ടിച്ചില്ലെങ്കിൽ, ഈ ഇമെയിൽ അവഗണിക്കാം.\n\n– BookEasy
