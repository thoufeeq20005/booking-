email.verify.subject=നിങ്ങളുടെ BookEasy ഇമെയിൽ സ്ഥിരീകരിക്കുക
email.verify.body=നമസ്കാരം {0},\n\nനിങ്ങളുടെ BookEasy അക്കൗണ്ട് സജ്ജീകരണം പൂർത്തിയാക്കാൻ ഇമെയിൽ വിലാസം സ്ഥിരീകരിക്കുക:\n{1}\n\nഈ ലിങ്ക് {2} മണിക്കൂറിനുള്ളിൽ കാലഹരണപ്പെടും. നിങ്ങൾ അക്കൗണ്ട് സൃഷ്ടിച്ചിട്ടില്ലെങ്കിൽ ഈ ഇമെയിൽ അവഗണിക്കാം.\n\n– BookEasy
email.reset.subject=നിങ്ങളുടെ BookEasy പാസ്‌വേഡ് റീസെറ്റ് ചെയ്യുക
email.reset.body=നമസ്കാരം {0},\n\nനിങ്ങളുടെ BookEasy പാസ്‌വേഡ് റീസെറ്റ് ചെയ്യാനുള്ള അഭ്യർത്ഥന ലഭിച്ചു. പുതിയ പാസ്‌വേഡ് ഇവിടെ തിരഞ്ഞെടുക്കുക:\n{1}\n\nഈ ലിങ്ക് {2} മിനിറ്റിനുള്ളിൽ കാലഹരണപ്പെടും. നിങ്ങൾ ഇത് ആവശ്യപ്പെട്ടിട്ടില്ലെങ്കിൽ ഈ ഇമെയിൽ അവഗണിക്കുക – നിങ്ങളുടെ പാസ്‌വേഡ് മാറില്ല.\n\n– BookEasy

# Business verification (Phase 3). Bodies: {0}=owner name, {1}=business name, {2}=reason, {3}=link. Subjects: {0}=business name.
email.org.noReason=കാരണമൊന്നും നൽകിയിട്ടില്ല.
email.org.submitted.subject={0} നുള്ള നിങ്ങളുടെ അപേക്ഷ ലഭിച്ചു
email.org.submitted.body=നമസ്കാരം {0},\n\nBookEasy-ൽ {1} രജിസ്റ്റർ ചെയ്തതിന് നന്ദി. ഞങ്ങളുടെ ടീം സാധാരണയായി 2 പ്രവൃത്തി ദിവസത്തിനുള്ളിൽ നിങ്ങളുടെ വിവരങ്ങളും രേഖകളും പരിശോധിക്കും. തീരുമാനമായാലുടൻ ഞങ്ങൾ ഇമെയിൽ അയയ്ക്കും.\n\nസ്റ്റാറ്റസ് ഇവിടെ കാണുക:\n{3}\n\n– BookEasy
email.org.approved.subject={0} BookEasy-ൽ അംഗീകരിച്ചു
email.org.approved.body=നമസ്കാരം {0},\n\nസന്തോഷവാർത്ത – {1} BookEasy-ൽ പരിശോധിച്ച് അംഗീകരിച്ചു. ഇനി നിങ്ങളുടെ സേവനങ്ങൾ സജ്ജമാക്കി ബുക്കിംഗുകൾ സ്വീകരിച്ചു തുടങ്ങാം.\n\nനിങ്ങളുടെ ബിസിനസ് തുറക്കുക:\n{3}\n\n– BookEasy
email.org.rejected.subject=നടപടി ആവശ്യമാണ്: {0} നുള്ള നിങ്ങളുടെ അപേക്ഷ
email.org.rejected.body=നമസ്കാരം {0},\n\n{1} ഇപ്പോൾ അംഗീകരിക്കാൻ കഴിഞ്ഞില്ല. ഞങ്ങളുടെ അവലോകന ടീമിന്റെ കാരണം:\n{2}\n\nനിങ്ങളുടെ വിവരങ്ങളോ രേഖകളോ പുതുക്കി വീണ്ടും സമർപ്പിക്കുക:\n{3}\n\n– BookEasy
email.org.suspended.subject={0} BookEasy-ൽ താൽക്കാലികമായി നിർത്തിവച്ചു
email.org.suspended.body=നമസ്കാരം {0},\n\n{1} താൽക്കാലികമായി നിർത്തിവച്ചിരിക്കുന്നു, ഇനി ഉപഭോക്താക്കൾക്ക് കാണാനാവില്ല. കാരണം:\n{2}\n\nഇത് തെറ്റാണെന്ന് തോന്നുന്നുവെങ്കിൽ BookEasy സപ്പോർട്ടുമായി ബന്ധപ്പെടുക.\n{3}\n\n– BookEasy
email.org.reinstated.subject={0} വീണ്ടും BookEasy-ൽ സജീവമാണ്
email.org.reinstated.body=നമസ്കാരം {0},\n\n{1} പുനഃസ്ഥാപിച്ചു, വീണ്ടും ഉപഭോക്താക്കൾക്ക് കാണാം.\n\n{3}\n\n– BookEasy

# Admin reset of two-step verification (Phase 4). {0}=name, {1}=account link.
email.twoFactorReset.subject=നിങ്ങളുടെ BookEasy അക്കൗണ്ടിൽ ടു-സ്റ്റെപ്പ് വെരിഫിക്കേഷൻ ഓഫാക്കി
email.twoFactorReset.body=നമസ്കാരം {0},\n\nനിങ്ങളുടെ അഭ്യർത്ഥന പ്രകാരം BookEasy സപ്പോർട്ട് നിങ്ങളുടെ അക്കൗണ്ടിൽ ടു-സ്റ്റെപ്പ് വെരിഫിക്കേഷൻ ഓഫാക്കുകയും എല്ലാ ഉപകരണങ്ങളിൽ നിന്നും നിങ്ങളെ സൈൻ ഔട്ട് ചെയ്യുകയും ചെയ്തു.\n\nവീണ്ടും സൈൻ ഇൻ ചെയ്ത് പുതിയ ഫോൺ ഉപയോഗിച്ച് ഇവിടെ സജ്ജമാക്കുക:\n{1}\n\nനിങ്ങൾ ഇത് ആവശ്യപ്പെട്ടിട്ടില്ലെങ്കിൽ, ഉടൻ BookEasy സപ്പോർട്ടുമായി ബന്ധപ്പെടുക.\n\n– BookEasy

