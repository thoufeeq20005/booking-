email.staffInvite.body=നമസ്കാരം {0},\n\nഉപഭോക്താക്കൾക്ക് നിങ്ങളോടൊപ്പം അപ്പോയിന്റ്മെന്റുകൾ ബുക്ക് ചെയ്യാൻ, {1} നിങ്ങളെ BookEasy-ൽ അവരുടെ ടീമിൽ ചേരാൻ ക്ഷണിച്ചു.\n\nക്ഷണം ഇവിടെ സ്വീകരിക്കുക (ഈ ഇമെയിൽ വിലാസം ഉപയോഗിച്ച് സൈൻ ഇൻ ചെയ്യുക അല്ലെങ്കിൽ അക്കൗണ്ട് സൃഷ്ടിക്കുക):\n{2}\n\nഈ ലിങ്ക് {3} ദിവസത്തിനുള്ളിൽ കാലഹരണപ്പെടും. നിങ്ങൾ ഇത് പ്രതീക്ഷിച്ചിരുന്നില്ലെങ്കിൽ, ഈ ഇമെയിൽ അവഗണിക്കാം.\n\n– BookEasy

