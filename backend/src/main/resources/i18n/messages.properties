# BookEasy transactional email texts (UTF-8). MessageFormat: double any apostrophe ('').
email.verify.subject=Verify your BookEasy email
email.verify.body=Hi {0},\n\nConfirm your email address to finish setting up your BookEasy account:\n{1}\n\nThis link expires in {2} hours. If you didn''t create an account, you can ignore this email.\n\n– BookEasy
email.reset.subject=Reset your BookEasy password
email.reset.body=Hi {0},\n\nWe received a request to reset your BookEasy password. Choose a new one here:\n{1}\n\nThis link expires in {2} minutes. If you didn''t ask for this, ignore this email – your password stays the same.\n\n– BookEasy
