email.loginCode.subject={0} is your BookEasy sign-in code
email.loginCode.body=Hi {0},\n\nYour BookEasy sign-in code is: {1}\n\nIt expires in {2} minutes. Never share this code with anyone – BookEasy staff will never ask for it.\nIf you didn''t try to sign in, you can ignore this email.\n\n– BookEasy
