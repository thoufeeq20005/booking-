notify.BOOKING_CONFIRMED.body=Your {0} at {1} on {2} is confirmed. Show your booking pass when you arrive.
notify.BOOKING_REQUESTED.title=Booking request sent: {0}
notify.BOOKING_REQUESTED.body={1} will confirm your {0} on {2} soon.
notify.BOOKING_NEW.title=New booking: {0}
notify.BOOKING_NEW.body={4} booked {0} on {2}.
