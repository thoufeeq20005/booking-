# BookEasy transactional email texts (UTF-8). MessageFormat: double any apostrophe ('').
email.verify.subject=Verify your BookEasy email
email.verify.body=Hi {0},\n\nConfirm your email address to finish setting up your BookEasy account:\n{1}\n\nThis link expires in {2} hours. If you didn''t create an account, you can ignore this email.\n\n– BookEasy
email.reset.subject=Reset your BookEasy password
email.reset.body=Hi {0},\n\nWe received a request to reset your BookEasy password. Choose a new one here:\n{1}\n\nThis link expires in {2} minutes. If you didn''t ask for this, ignore this email – your password stays the same.\n\n– BookEasy

# Business verification (Phase 3). Bodies: {0}=owner name, {1}=business name, {2}=reason, {3}=link. Subjects: {0}=business name.
email.org.noReason=No reason was given.
email.org.submitted.subject=We received your application for {0}
email.org.submitted.body=Hi {0},\n\nThanks for registering {1} on BookEasy. Our team will review your details and documents, usually within 2 working days. We''ll email you as soon as there''s a decision.\n\nTrack the status here:\n{3}\n\n– BookEasy
email.org.approved.subject={0} is approved on BookEasy
email.org.approved.body=Hi {0},\n\nGood news – {1} has been verified and approved on BookEasy. You can now finish setting up your services and start taking bookings.\n\nOpen your business:\n{3}\n\n– BookEasy
email.org.rejected.subject=Action needed: your application for {0}
email.org.rejected.body=Hi {0},\n\nWe couldn''t approve {1} yet. Reason from our review team:\n{2}\n\nPlease update your details or documents and submit again:\n{3}\n\n– BookEasy
email.org.suspended.subject={0} has been suspended on BookEasy
email.org.suspended.body=Hi {0},\n\n{1} has been suspended and is no longer visible to customers. Reason:\n{2}\n\nIf you think this is a mistake, contact BookEasy support.\n{3}\n\n– BookEasy
email.org.reinstated.subject={0} is active again on BookEasy
email.org.reinstated.body=Hi {0},\n\n{1} has been reinstated and is visible to customers again.\n\n{3}\n\n– BookEasy

# Admin reset of two-step verification (Phase 4). {0}=name, {1}=account link.
email.twoFactorReset.subject=Two-step verification was turned off on your BookEasy account
email.twoFactorReset.body=Hi {0},\n\nAt your request, BookEasy support turned off two-step verification on your account and signed you out on every device.\n\nSign in again and set it up with your new phone here:\n{1}\n\nIf you didn''t ask for this, contact BookEasy support immediately.\n\n– BookEasy

# Staff invitation (Phase 5). Subject {0}=business. Body {0}=invitee, {1}=business, {2}=link, {3}=days.
email.staffInvite.subject={0} invited you to join their team on BookEasy
email.staffInvite.body=Hi {0},\n\n{1} has invited you to join their team on BookEasy so customers can book appointments with you.\n\nAccept the invitation here (sign in or create an account with this email address):\n{2}\n\nThe link expires in {3} days. If you weren''t expecting this, you can ignore this email.\n\n– BookEasy
