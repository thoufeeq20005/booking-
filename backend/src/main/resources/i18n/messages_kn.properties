email.org.submitted.body=ನಮಸ್ಕಾರ {0},\n\nBookEasy ನಲ್ಲಿ {1} ನೋಂದಾಯಿಸಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದಗಳು. ನಮ್ಮ ತಂಡ ಸಾಮಾನ್ಯವಾಗಿ 2 ಕೆಲಸದ ದಿನಗಳಲ್ಲಿ ನಿಮ್ಮ ವಿವರಗಳು ಮತ್ತು ದಾಖಲೆಗಳನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ. ನಿರ್ಧಾರವಾದ ತಕ್ಷಣ ನಿಮಗೆ ಇಮೇಲ್ ಮಾಡುತ್ತೇವೆ.\n\nಸ್ಥಿತಿಯನ್ನು ಇಲ್ಲಿ ನೋಡಿ:\n{3}\n\n– BookEasy
email.org.approved.subject={0} BookEasy ನಲ್ಲಿ ಅನುಮೋದಿಸಲಾಗಿದೆ
email.org.approved.body=ನಮಸ್ಕಾರ {0},\n\nಸಿಹಿ ಸುದ್ದಿ – {1} BookEasy ನಲ್ಲಿ ಪರಿಶೀಲಿಸಿ ಅನುಮೋದಿಸಲಾಗಿದೆ. ಈಗ ನಿಮ್ಮ ಸೇವೆಗಳನ್ನು ಹೊಂದಿಸಿ ಬುಕಿಂಗ್‌ಗಳನ್ನು ಪಡೆಯಲು ಪ್ರಾರಂಭಿಸಬಹುದು.\n\nನಿಮ್ಮ ವ್ಯವಹಾರವನ್ನು ತೆರೆಯಿರಿ:\n{3}\n\n– BookEasy
email.org.rejected.subject=ಕ್ರಮ ಅಗತ್ಯ: {0} ಗಾಗಿ ನಿಮ್ಮ ಅರ್ಜಿ
email.org.rejected.body=ನಮಸ್ಕಾರ {0},\n\nನಾವು ಇನ್ನೂ {1} ಅನ್ನು ಅನುಮೋದಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ನಮ್ಮ ಪರಿಶೀಲನಾ ತಂಡದ ಕಾರಣ:\n{2}\n\nದಯವಿಟ್ಟು ನಿಮ್ಮ ವಿವರಗಳು ಅಥವಾ ದಾಖಲೆಗಳನ್ನು ನವೀಕರಿಸಿ ಮತ್ತೆ ಸಲ್ಲಿಸಿ:\n{3}\n\n– BookEasy
