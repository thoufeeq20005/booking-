email.staffInvite.body=ನಮಸ್ಕಾರ {0},\n\nಗ್ರಾಹಕರು ನಿಮ್ಮೊಂದಿಗೆ ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ಬುಕ್ ಮಾಡಲು, {1} ನಿಮ್ಮನ್ನು BookEasy ನಲ್ಲಿ ತಮ್ಮ ತಂಡಕ್ಕೆ ಸೇರಲು ಆಹ್ವಾನಿಸಿದೆ.\n\nಆಹ್ವಾನವನ್ನು ಇಲ್ಲಿ ಸ್ವೀಕರಿಸಿ (ಈ ಇಮೇಲ್ ವಿಳಾಸದಿಂದ ಸೈನ್ ಇನ್ ಮಾಡಿ ಅಥವಾ ಖಾತೆ ರಚಿಸಿ):\n{2}\n\nಈ ಲಿಂಕ್ {3} ದಿನಗಳಲ್ಲಿ ಅವಧಿ ಮೀರುತ್ತದೆ. ನೀವು ಇದನ್ನು ನಿರೀಕ್ಷಿಸದಿದ್ದರೆ, ಈ ಇಮೇಲ್ ಅನ್ನು ನಿರ್ಲಕ್ಷಿಸಬಹುದು.\n\n– BookEasy

