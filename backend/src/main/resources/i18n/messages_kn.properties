email.twoFactorReset.body=ನಮಸ್ಕಾರ {0},\n\nನಿಮ್ಮ ವಿನಂತಿಯಂತೆ BookEasy ಬೆಂಬಲ ತಂಡ ನಿಮ್ಮ ಖಾತೆಯಲ್ಲಿ ಎರಡು-ಹಂತದ ಪರಿಶೀಲನೆಯನ್ನು ಆಫ್ ಮಾಡಿ, ಎಲ್ಲಾ ಸಾಧನಗಳಿಂದ ನಿಮ್ಮನ್ನು ಸೈನ್ ಔಟ್ ಮಾಡಿದೆ.\n\nಮತ್ತೆ ಸೈನ್ ಇನ್ ಮಾಡಿ ನಿಮ್ಮ ಹೊಸ ಫೋನ್‌ನೊಂದಿಗೆ ಇಲ್ಲಿ ಹೊಂದಿಸಿ:\n{1}\n\nನೀವು ಇದನ್ನು ವಿನಂತಿಸದಿದ್ದರೆ, ತಕ್ಷಣ BookEasy ಬೆಂಬಲವನ್ನು ಸಂಪರ್ಕಿಸಿ.\n\n– BookEasy

