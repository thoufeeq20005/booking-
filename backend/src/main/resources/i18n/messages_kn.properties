email.verify.subject=ನಿಮ್ಮ BookEasy ಇಮೇಲ್ ಪರಿಶೀಲಿಸಿ
email.verify.body=ನಮಸ್ಕಾರ {0},\n\nನಿಮ್ಮ BookEasy ಖಾತೆಯ ಸೆಟಪ್ ಪೂರ್ಣಗೊಳಿಸಲು ನಿಮ್ಮ ಇಮೇಲ್ ವಿಳಾಸವನ್ನು ದೃಢೀಕರಿಸಿ:\n{1}\n\nಈ ಲಿಂಕ್ {2} ಗಂಟೆಗಳಲ್ಲಿ ಅವಧಿ ಮುಗಿಯುತ್ತದೆ. ನೀವು ಖಾತೆ ರಚಿಸದಿದ್ದರೆ, ಈ ಇಮೇಲ್ ಅನ್ನು ನಿರ್ಲಕ್ಷಿಸಬಹುದು.\n\n– BookEasy
email.reset.subject=ನಿಮ್ಮ BookEasy ಪಾಸ್‌ವರ್ಡ್ ಮರುಹೊಂದಿಸಿ
email.reset.body=ನಮಸ್ಕಾರ {0},\n\nನಿಮ್ಮ BookEasy ಪಾಸ್‌ವರ್ಡ್ ಮರುಹೊಂದಿಸಲು ವಿನಂತಿ ಬಂದಿದೆ. ಹೊಸ ಪಾಸ್‌ವರ್ಡ್ ಅನ್ನು ಇಲ್ಲಿ ಆರಿಸಿ:\n{1}\n\nಈ ಲಿಂಕ್ {2} ನಿಮಿಷಗಳಲ್ಲಿ ಅವಧಿ ಮುಗಿಯುತ್ತದೆ. ನೀವು ಇದನ್ನು ವಿನಂತಿಸದಿದ್ದರೆ, ಈ ಇಮೇಲ್ ಅನ್ನು ನಿರ್ಲಕ್ಷಿಸಿ – ನಿಮ್ಮ ಪಾಸ್‌ವರ್ಡ್ ಬದಲಾಗುವುದಿಲ್ಲ.\n\n– BookEasy
