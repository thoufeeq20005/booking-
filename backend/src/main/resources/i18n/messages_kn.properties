email.org.suspended.body=ನಮಸ್ಕಾರ {0},\n\n{1} ಅನ್ನು ಅಮಾನತುಗೊಳಿಸಲಾಗಿದೆ ಮತ್ತು ಇನ್ನು ಗ್ರಾಹಕರಿಗೆ ಕಾಣಿಸುವುದಿಲ್ಲ. ಕಾರಣ:\n{2}\n\nಇದು ತಪ್ಪು ಎಂದು ನೀವು ಭಾವಿಸಿದರೆ, BookEasy ಬೆಂಬಲವನ್ನು ಸಂಪರ್ಕಿಸಿ.\n{3}\n\n– BookEasy
