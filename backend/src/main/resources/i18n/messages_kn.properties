email.loginCode.body=ನಮಸ್ಕಾರ {0},\n\nನಿಮ್ಮ BookEasy ಸೈನ್-ಇನ್ ಕೋಡ್: {1}\n\nಇದು {2} ನಿಮಿಷಗಳಲ್ಲಿ ಅವಧಿ ಮುಗಿಯುತ್ತದೆ. ಈ ಕೋಡ್ ಅನ್ನು ಯಾರೊಂದಿಗೂ ಹಂಚಿಕೊಳ್ಳಬೇಡಿ – BookEasy ಸಿಬ್ಬಂದಿ ಎಂದಿಗೂ ಕೇಳುವುದಿಲ್ಲ.\nನೀವು ಸೈನ್ ಇನ್ ಮಾಡಲು ಪ್ರಯತ್ನಿಸದಿದ್ದರೆ, ಈ ಇಮೇಲ್ ಅನ್ನು ನಿರ್ಲಕ್ಷಿಸಿ.\n\n– BookEasy
