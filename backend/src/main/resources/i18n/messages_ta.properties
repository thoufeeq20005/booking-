# BookEasy transactional email texts (UTF-8). MessageFormat: double any apostrophe ('').
email.verify.subject=உங்கள் BookEasy மின்னஞ்சலைச் சரிபார்க்கவும்
email.verify.body=வணக்கம் {0},\n\nஉங்கள் BookEasy கணக்கை அமைப்பதை முடிக்க உங்கள் மின்னஞ்சல் முகவரியை உறுதிப்படுத்தவும்:\n{1}\n\nஇந்த இணைப்பு {2} மணிநேரத்தில் காலாவதியாகும். நீங்கள் கணக்கை உருவாக்கவில்லை என்றால், இந்த மின்னஞ்சலைப் புறக்கணிக்கலாம்.\n\n– BookEasy
email.reset.subject=உங்கள் BookEasy கடவுச்சொல்லை மீட்டமைக்கவும்
email.reset.body=வணக்கம் {0},\n\nஉங்கள் BookEasy கடவுச்சொல்லை மீட்டமைக்க ஒரு கோரிக்கை வந்துள்ளது. புதிய கடவுச்சொல்லை இங்கே தேர்ந்தெடுக்கவும்:\n{1}\n\nஇந்த இணைப்பு {2} நிமிடங்களில் காலாவதியாகும். நீங்கள் இதைக் கோரவில்லை என்றால், இந்த மின்னஞ்சலைப் புறக்கணிக்கவும் – உங்கள் கடவுச்சொல் மாறாது.\n\n– BookEasy

# Business verification (Phase 3). Bodies: {0}=owner name, {1}=business name, {2}=reason, {3}=link. Subjects: {0}=business name.
email.org.noReason=காரணம் எதுவும் குறிப்பிடப்படவில்லை.
email.org.submitted.subject={0} க்கான உங்கள் விண்ணப்பம் கிடைத்தது
email.org.submitted.body=வணக்கம் {0},\n\nBookEasy இல் {1} ஐப் பதிவு செய்ததற்கு நன்றி. எங்கள் குழு உங்கள் விவரங்களையும் ஆவணங்களையும் பொதுவாக 2 வேலை நாட்களுக்குள் சரிபார்க்கும். முடிவு வந்தவுடன் உங்களுக்கு மின்னஞ்சல் அனுப்புவோம்.\n\nநிலையை இங்கே பார்க்கவும்:\n{3}\n\n– BookEasy
email.org.approved.subject={0} BookEasy இல் அங்கீகரிக்கப்பட்டது
email.org.approved.body=வணக்கம் {0},\n\nநல்ல செய்தி – {1} BookEasy இல் சரிபார்க்கப்பட்டு அங்கீகரிக்கப்பட்டது. இப்போது உங்கள் சேவைகளை அமைத்து முன்பதிவுகளைப் பெறத் தொடங்கலாம்.\n\nஉங்கள் வணிகத்தைத் திறக்கவும்:\n{3}\n\n– BookEasy
email.org.rejected.subject=நடவடிக்கை தேவை: {0} க்கான உங்கள் விண்ணப்பம்
email.org.rejected.body=வணக்கம் {0},\n\n{1} ஐ இப்போது அங்கீகரிக்க இயலவில்லை. எங்கள் மதிப்பாய்வுக் குழுவின் காரணம்:\n{2}\n\nஉங்கள் விவரங்கள் அல்லது ஆவணங்களைப் புதுப்பித்து மீண்டும் சமர்ப்பிக்கவும்:\n{3}\n\n– BookEasy
email.org.suspended.subject={0} BookEasy இல் இடைநிறுத்தப்பட்டது
email.org.suspended.body=வணக்கம் {0},\n\n{1} இடைநிறுத்தப்பட்டுள்ளது, இனி வாடிக்கையாளர்களுக்குத் தெரியாது. காரணம்:\n{2}\n\nஇது தவறு என்று நினைத்தால், BookEasy ஆதரவைத் தொடர்பு கொள்ளவும்.\n{3}\n\n– BookEasy
email.org.reinstated.subject={0} மீண்டும் BookEasy இல் செயலில் உள்ளது
email.org.reinstated.body=வணக்கம் {0},\n\n{1} மீண்டும் செயல்படுத்தப்பட்டு வாடிக்கையாளர்களுக்குத் தெரிகிறது.\n\n{3}\n\n– BookEasy

# Admin reset of two-step verification (Phase 4). {0}=name, {1}=account link.
email.twoFactorReset.subject=உங்கள் BookEasy கணக்கில் இரண்டு-படி சரிபார்ப்பு அணைக்கப்பட்டது
email.twoFactorReset.body=வணக்கம் {0},\n\nஉங்கள் கோரிக்கையின்படி, BookEasy ஆதரவுக் குழு உங்கள் கணக்கில் இரண்டு-படி சரிபார்ப்பை அணைத்து, எல்லா சாதனங்களிலிருந்தும் உங்களை வெளியேற்றியுள்ளது.\n\nமீண்டும் உள்நுழைந்து உங்கள் புதிய தொலைபேசியுடன் இங்கே அமைக்கவும்:\n{1}\n\nநீங்கள் இதைக் கோரவில்லை என்றால், உடனடியாக BookEasy ஆதரவைத் தொடர்பு கொள்ளவும்.\n\n– BookEasy

# Staff invitation (Phase 5). Subject {0}=business. Body {0}=invitee, {1}=business, {2}=link, {3}=days.
email.staffInvite.subject={0} உங்களை BookEasy இல் தங்கள் குழுவில் சேர அழைத்துள்ளது
email.staffInvite.body=வணக்கம் {0},\n\nவாடிக்கையாளர்கள் உங்களுடன் சந்திப்புகளை முன்பதிவு செய்ய, {1} உங்களை BookEasy இல் தங்கள் குழுவில் சேர அழைத்துள்ளது.\n\nஅழைப்பை இங்கே ஏற்கவும் (இந்த மின்னஞ்சல் முகவரியுடன் உள்நுழையவும் அல்லது கணக்கை உருவாக்கவும்):\n{2}\n\nஇந்த இணைப்பு {3} நாட்களில் காலாவதியாகும். இதை நீங்கள் எதிர்பார்க்கவில்லை என்றால், இந்த மின்னஞ்சலைப் புறக்கணிக்கலாம்.\n\n– BookEasy

