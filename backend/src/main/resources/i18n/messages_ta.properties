email.loginCode.subject={0} உங்கள் BookEasy உள்நுழைவுக் குறியீடு
email.loginCode.body=வணக்கம் {0},\n\nஉங்கள் BookEasy உள்நுழைவுக் குறியீடு: {1}\n\nஇது {2} நிமிடங்களில் காலாவதியாகும். இந்தக் குறியீட்டை யாருடனும் பகிர வேண்டாம் – BookEasy ஊழியர்கள் ஒருபோதும் கேட்க மாட்டார்கள்.\nநீங்கள் உள்நுழைய முயற்சிக்கவில்லை என்றால், இந்த மின்னஞ்சலைப் புறக்கணிக்கலாம்.\n\n– BookEasy
