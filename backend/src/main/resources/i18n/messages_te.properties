email.loginCode.subject={0} మీ BookEasy సైన్-ఇన్ కోడ్
email.loginCode.body=నమస్తే {0},\n\nమీ BookEasy సైన్-ఇన్ కోడ్: {1}\n\nఇది {2} నిమిషాల్లో గడువు ముగుస్తుంది. ఈ కోడ్‌ను ఎవరితోనూ పంచుకోవద్దు – BookEasy సిబ్బంది ఎప్పుడూ అడగరు.\nమీరు సైన్ ఇన్ చేయడానికి ప్రయత్నించకపోతే, ఈ ఇమెయిల్‌ను పట్టించుకోవద్దు.\n\n– BookEasy
email.verifyCode.subject={0} మీ BookEasy ఇమెయిల్ ధృవీకరణ కోడ్
email.verifyCode.body=నమస్తే {0},\n\nBookEasy‌లో మీ ఇమెయిల్ చిరునామాను ధృవీకరించడానికి ఈ కోడ్ వాడండి: {1}\n\nఇది {2} నిమిషాల్లో గడువు ముగుస్తుంది. ఈ కోడ్‌ను ఎవరితోనూ పంచుకోవద్దు.\nమీరు BookEasy ఖాతా సృష్టించకపోతే, ఈ ఇమెయిల్‌ను పట్టించుకోవద్దు.\n\n– BookEasy
