# BookEasy transactional email texts (UTF-8). MessageFormat: double any apostrophe ('').
email.verify.subject=మీ BookEasy ఇమెయిల్‌ను ధృవీకరించండి
email.verify.body=నమస్కారం {0},\n\nమీ BookEasy ఖాతా సెటప్ పూర్తి చేయడానికి మీ ఇమెయిల్ చిరునామాను నిర్ధారించండి:\n{1}\n\nఈ లింక్ {2} గంటల్లో గడువు ముగుస్తుంది. మీరు ఖాతా సృష్టించకపోతే, ఈ ఇమెయిల్‌ను విస్మరించవచ్చు.\n\n– BookEasy
email.reset.subject=మీ BookEasy పాస్‌వర్డ్‌ను రీసెట్ చేయండి
email.reset.body=నమస్కారం {0},\n\nమీ BookEasy పాస్‌వర్డ్ రీసెట్ చేయమని అభ్యర్థన వచ్చింది. కొత్త పాస్‌వర్డ్‌ను ఇక్కడ ఎంచుకోండి:\n{1}\n\nఈ లింక్ {2} నిమిషాల్లో గడువు ముగుస్తుంది. మీరు దీన్ని అభ్యర్థించకపోతే, ఈ ఇమెయిల్‌ను విస్మరించండి – మీ పాస్‌వర్డ్ మారదు.\n\n– BookEasy

# Business verification (Phase 3). Bodies: {0}=owner name, {1}=business name, {2}=reason, {3}=link. Subjects: {0}=business name.
email.org.noReason=కారణం ఏదీ ఇవ్వలేదు.
email.org.submitted.subject={0} కోసం మీ దరఖాస్తు అందింది
email.org.submitted.body=నమస్తే {0},\n\nBookEasy లో {1} ను నమోదు చేసినందుకు ధన్యవాదాలు. మా బృందం సాధారణంగా 2 పని దినాల్లో మీ వివరాలు మరియు పత్రాలను పరిశీలిస్తుంది. నిర్ణయం వెలువడిన వెంటనే మీకు ఇమెయిల్ చేస్తాము.\n\nస్థితిని ఇక్కడ చూడండి:\n{3}\n\n– BookEasy
email.org.approved.subject={0} BookEasy లో ఆమోదించబడింది
email.org.approved.body=నమస్తే {0},\n\nశుభవార్త – {1} BookEasy లో ధృవీకరించబడి ఆమోదించబడింది. ఇప్పుడు మీ సేవలను సెటప్ చేసి బుకింగ్‌లు తీసుకోవడం ప్రారంభించవచ్చు.\n\nమీ వ్యాపారాన్ని తెరవండి:\n{3}\n\n– BookEasy
email.org.rejected.subject=చర్య అవసరం: {0} కోసం మీ దరఖాస్తు
email.org.rejected.body=నమస్తే {0},\n\nమేము ఇంకా {1} ను ఆమోదించలేకపోయాము. మా సమీక్ష బృందం చెప్పిన కారణం:\n{2}\n\nదయచేసి మీ వివరాలు లేదా పత్రాలను నవీకరించి మళ్లీ సమర్పించండి:\n{3}\n\n– BookEasy
email.org.suspended.subject={0} BookEasy లో నిలిపివేయబడింది
email.org.suspended.body=నమస్తే {0},\n\n{1} నిలిపివేయబడింది, ఇకపై కస్టమర్లకు కనిపించదు. కారణం:\n{2}\n\nఇది పొరపాటు అని మీరు భావిస్తే, BookEasy సపోర్ట్‌ను సంప్రదించండి.\n{3}\n\n– BookEasy
email.org.reinstated.subject={0} మళ్లీ BookEasy లో సక్రియంగా ఉంది
email.org.reinstated.body=నమస్తే {0},\n\n{1} పునరుద్ధరించబడింది, మళ్లీ కస్టమర్లకు కనిపిస్తుంది.\n\n{3}\n\n– BookEasy

# Admin reset of two-step verification (Phase 4). {0}=name, {1}=account link.
email.twoFactorReset.subject=మీ BookEasy ఖాతాలో రెండు-దశల ధృవీకరణ ఆఫ్ చేయబడింది
email.twoFactorReset.body=నమస్తే {0},\n\nమీ అభ్యర్థన మేరకు BookEasy సపోర్ట్ మీ ఖాతాలో రెండు-దశల ధృవీకరణను ఆఫ్ చేసి, అన్ని పరికరాల నుండి మిమ్మల్ని సైన్ అవుట్ చేసింది.\n\nమళ్లీ సైన్ ఇన్ చేసి మీ కొత్త ఫోన్‌తో ఇక్కడ సెటప్ చేయండి:\n{1}\n\nమీరు దీన్ని అభ్యర్థించకపోతే, వెంటనే BookEasy సపోర్ట్‌ను సంప్రదించండి.\n\n– BookEasy
