# Render Blueprint for the BookEasy API. Secrets are declared with `sync: false` and must be
# entered in the Render dashboard; nothing secret is stored in this file.
services:
  - type: web
    name: bookeasy-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter            # persistent disks require a paid instance
    region: singapore        # closest Render region to India
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    disk:
      name: bookeasy-uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FILE_STORAGE_PATH
        value: /var/data/uploads
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -Duser.timezone=UTC
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
