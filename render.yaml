# Render Blueprint for the BookEasy API. Secrets are declared with `sync: false` and must be
# entered in the Render dashboard; nothing secret is stored in this file.
services:
  - type: web
    name: bookeasy-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # free: sleeps after 15 idle minutes (the first visit then takes about a minute) and has no persistent disk, so
    # files people upload are lost on each restart or deploy; the demo photos are built into the image and always
    # present. For real use switch to "starter" and uncomment the disk below.
    plan: free
    region: singapore        # closest Render region to India
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    # disk:
    #   name: bookeasy-uploads
    #   mountPath: /var/data
    #   sizeGB: 5
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FILE_STORAGE_PATH
        value: /var/data/uploads
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -Duser.timezone=UTC
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLIENT_IP_XFF_INDEX
        value: "2"
      - key: JWT_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      # Render's free plan blocks SMTP: use EMAIL_PROVIDER=brevo with a Brevo API key (docs/integrations/email.md).
      - key: EMAIL_API_KEY
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_OTP_TEMPLATE_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ROUTE_ENABLED
        value: "false"
      - key: PAYMENT_HOLD_MINUTES
        value: "15"
      # AI recommendations (docs/integrations/ai-recommendations.md); leave the keys empty for rule-based picks.
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
